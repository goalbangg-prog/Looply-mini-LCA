<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1240">
<title>Looply - LCA 데이터 분석</title>
<meta name="description" content="환경성적표지 평가계수 398개로 만든 LCA 데이터 분석 리포트와 환경영향 계산기">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#report"><span><span class="dot"></span> Looply</span><small>LCA 데이터 분석</small></a>
  <nav aria-label="주요 메뉴">
    <button data-tab="report">분석 리포트</button>
    <button data-tab="calc">환경영향 계산</button>
    <button data-tab="explore">데이터 분석</button>
    <button data-tab="cluster">군집 분석</button>
    <button data-tab="notes">방법·출처</button>
  </nav>
  <span class="badge" id="badge"></span>
</div></header>
<main class="wrap">
  <div id="report" data-pane="report"></div>
  <div id="calc" data-pane="calc" class="hidden"></div>
  <div id="explore" data-pane="explore" class="hidden"></div>
  <div id="cluster" data-pane="cluster" class="hidden"></div>
  <div id="notes" data-pane="notes" class="hidden"></div>
  <p class="foot">자료: 한국환경산업기술원 환경성적표지 평가계수(2021-08-02). 본 페이지는 탐색적 데이터 분석 포트폴리오이며, ISO 14040/14044에 따른 전과정평가(LCA) 또는 인증 결과가 아닙니다. 제품 비교·의사결정에 직접 사용할 수 없으며, 원자료 이용 조건은 별도 확인이 필요합니다.</p>
</main>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" onerror="void 0"></script>

<script src="js/main.js"></script>
</body>
</html>
