<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1180">
<title>Looply - LCA 데이터 분석</title>
<meta name="description" content="환경성적표지 평가계수 398개로 만든 LCA 데이터 분석 리포트와 환경영향 계산기">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#report"><span><span class="dot"></span> Looply</span><small>LCA 데이터 분석</small></a>
  <nav aria-label="주요 메뉴">
    <button data-tab="report">분석 리포트</button>
    <button data-tab="calc">환경영향 계산</button>
    <button data-tab="explore">데이터 탐색</button>
    <button data-tab="cluster">묶어 보기</button>
  </nav>
  <span class="badge" id="badge"></span>
</div></header>
<main class="wrap">
  <div id="report" data-pane="report"></div>
  <div id="calc" data-pane="calc" class="hidden"></div>
  <div id="explore" data-pane="explore" class="hidden"></div>
  <div id="cluster" data-pane="cluster" class="hidden"></div>
  <p class="foot">자료: 한국환경산업기술원 환경성적표지 평가계수(2021-08-02). 학습·포트폴리오용 탐색 분석이며, ISO 14040/14044를 따른 전과정평가(LCA)나 인증 결과가 아니에요. 제품 비교나 의사결정에 그대로 쓰지 마세요. 원자료 이용 조건은 별도 확인이 필요해요.</p>
</main>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" onerror="void 0"></script>

<script src="js/results.js"></script>
<script src="js/stats.js"></script>
<script src="js/common.js"></script>
<script src="js/report.js"></script>
<script src="js/calc.js"></script>
<script src="js/explore.js"></script>
<script src="js/cluster.js"></script>
<script src="js/main.js"></script>
</body>
</html>
